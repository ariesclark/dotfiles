[package]
name = "op-contextual"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ssh"
path = "src/bin/ssh.rs"
test = false

[[bin]]
name = "op-ssh-sign"
path = "src/bin/op-ssh-sign.rs"
test = false

[dependencies]
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true