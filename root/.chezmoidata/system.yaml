system:
  volumes:
    c:
      label: System
      size: 100GB
    d:
      label: Data
      size: 500GB
    e:
      label: Apps
      size: fill
      pagefile: auto

  wsl:
    distribution: Ubuntu
    user: aries
    drive: w
    memory: 50%
    swap: 4GB
    docker:
      memory: 50%
      swap: 2GB
      container:
        memory: 25%
        swap: 1GB
    packages:
      - git
      - jq
      - bats
      - shfmt
      - unzip
      - rustup
      - mingw-w64
      - build-essential
      - pkg-config
      - libssl-dev
      - dotnet-sdk-10.0
      - default-jre-headless
      - python3-venv
      - wl-clipboard
      - xdg-utils
      # Erlang builds through asdf-erlang, without wx, ODBC, Java or docs:
      # https://github.com/asdf-vm/asdf-erlang/blob/master/README.md
      - autoconf
      - m4
      - libncurses-dev
      - cmake
      - docker.io
      - docker-compose-v2
      - docker-buildx
      - uidmap
      - dbus-user-session
      - rootlesskit
      - slirp4netns
      - acl
      - earlyoom

  install:
    scoop: 'E:\Scoop'
    winget: 'E:\Apps'
    configurationModules: 'E:\Cache\WinGet\Modules'
    record: 'D:\Machine\packages.json'

  cheznous:
    version: '2.74.1-cheznous.4'
