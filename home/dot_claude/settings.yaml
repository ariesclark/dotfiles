settings:
  $schema: https://json.schemastore.org/claude-code-settings.json
  env:
    DO_NOT_TRACK: '0'
  attribution:
    commit: ''
    pr: ''
    sessionUrl: false
  includeGitInstructions: false
  permissions:
    defaultMode: auto
    allow:
      - Bash(git add:*)
    ask:
      - Bash(git push:*)
      - Bash(*npm add*)
      - Bash(*npm install*)
      - Bash(*npm i)
      - Bash(*npm i *)
    deny:
      - Read(*.env)
      - Bash(rm:*)
      - Bash(gh pr create:*)
  model: opus[1m]
  disableClaudeAiConnectors: true
  worktree:
    bgIsolation: none
  effortLevel: medium
  outputStyle: Concise
  switchModelsOnFlag: false
  tui: fullscreen
  theme: auto
  verbose: false
  feedbackSurveyRate: 0
  skipWorkflowUsageWarning: true
  remoteControlAtStartup: true
  inputNeededNotifEnabled: true
  agentPushNotifEnabled: true
  enabledPlugins:
    claude-md-management@claude-plugins-official: true
    plugin-dev@claude-plugins-official: false
    pulumi@pulumi-agent-skills: true
    rust-analyzer-lsp@claude-plugins-official: false
    sentry-cli@claude-plugins-official: false
    skill-creator@claude-plugins-official: false
    paper-desktop@paper: false
    cc-plugin-you-should-know@builtin: true
  extraKnownMarketplaces:
    ast-grep-marketplace:
      source:
        source: git
        url: https://github.com/ast-grep/agent-skill.git
    chrome-devtools-plugins:
      source:
        source: github
        repo: ChromeDevTools/chrome-devtools-mcp
    cloudflare:
      source:
        source: github
        repo: cloudflare/skills
      autoUpdate: true
    pulumi-agent-skills:
      source:
        source: github
        repo: pulumi/agent-skills
    paper:
      source:
        source: github
        repo: paper-design/agent-plugins
  autoMode:
    hard_deny:
      - $defaults
      - Never delete with `rm`, in a shell command or in executed code; use `trash` instead.
      - >-
        Never write a scratch file into the project tree or at a bare path in a system temp directory. Scratch
        goes in a named subdirectory of the session scratchpad directory given in the environment. Creating that
        subdirectory and writing inside it is expected; writing to `/tmp/<file>` directly is not.
      - Never edit a chezmoi-managed file at its target under `~`. Edit its source in the chezmoi repo instead (`chezmoi edit <file>`).
      - >-
        Never disable or bypass git commit signing: no `--no-gpg-sign`, no `-c commit.gpgsign=false`, no
        `git config` write that turns signing off.
      - >-
        Never create a pull request. This covers `gh pr create` and any equivalent API call, such as `gh api` or
        `curl` POSTing to a `/pulls` endpoint.

linux:
  statusLine:
    type: command
    command: .claude/statusline.sh
  enabledPlugins:
    github@ariesclark: true
    guardrails@ariesclark: true
    papercuts@ariesclark: true
    prior-art@ariesclark: true
    why@ariesclark: true
    writing@ariesclark: true
    kagi@kagi-cli: true
  extraKnownMarketplaces:
    ariesclark:
      source:
        source: directory
        path: repos/ariesclark/skills
      autoUpdate: true
    kagi-cli:
      source:
        source: directory
        path: repos/microck/kagi-cli
