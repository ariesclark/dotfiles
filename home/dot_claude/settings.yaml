# Read by modify_settings.json, never written to ~ itself (.chezmoiignore).
settings: # merged over ~/.claude/settings.json; keys Claude Code adds itself are kept
  $schema: https://json.schemastore.org/claude-code-settings.json
  env:
    DO_NOT_TRACK: '0'
  attribution:
    commit: ''
    pr: ''
    sessionUrl: false
  includeGitInstructions: false
  permissions:
    defaultMode: auto
    allow:
      - Bash(git add:*)
    ask:
      - Bash(git push:*)
    deny:
      - Read(*.env)
      - Bash(rm:*)
      - Bash(gh pr create:*)
  disableClaudeAiConnectors: true
  worktree:
    bgIsolation: none
  effortLevel: medium
  tui: fullscreen
  theme: auto
  verbose: false
  feedbackSurveyRate: 0
  skipWorkflowUsageWarning: true
  remoteControlAtStartup: true
  inputNeededNotifEnabled: true
  agentPushNotifEnabled: true
  enabledPlugins:
    claude-md-management@claude-plugins-official: true
    plugin-dev@claude-plugins-official: true
    pulumi@pulumi-agent-skills: true
    rust-analyzer-lsp@claude-plugins-official: true
    sentry-cli@claude-plugins-official: true
    skill-creator@claude-plugins-official: true
  extraKnownMarketplaces:
    ast-grep-marketplace:
      source:
        source: git
        url: https://github.com/ast-grep/agent-skill.git
    chrome-devtools-plugins:
      source:
        source: github
        repo: ChromeDevTools/chrome-devtools-mcp
    cloudflare:
      source:
        source: github
        repo: cloudflare/skills
      autoUpdate: true
    pulumi-agent-skills:
      source:
        source: github
        repo: pulumi/agent-skills
  autoMode:
    hard_deny:
      - $defaults
      - Never use `rm`, use `trash` instead.
      - >-
        Never write a scratch file to a bare path in a system temp directory, and never write one outside the
        session scratch directory. Scratch goes in `.claude/tmp/<friendly-name>/`, which is a symlink to a
        `mktemp -d -t "<friendly-name>.XXXXXX"` directory, so the work stays visible in the user's editor.
        Creating that directory and writing inside it is expected; writing to `/tmp/<file>` directly is not.
      - Never edit a chezmoi-managed file at its target under `~`. Edit its source in the chezmoi repo instead (`chezmoi edit <file>`).
      - >-
        Never disable or bypass git commit signing: no `--no-gpg-sign`, no `-c commit.gpgsign=false`, no
        `git config` write that turns signing off.
      - >-
        Never create a pull request. This covers `gh pr create` and any equivalent API call, such as `gh api` or
        `curl` POSTing to a `/pulls` endpoint.

linux: # merged over settings on Linux and WSL, where these folders and scripts exist; paths are under ~
  statusLine:
    type: command
    command: .claude/statusline.sh
  enabledPlugins:
    github@ariesclark: true
    guardrails@ariesclark: true
    papercuts@ariesclark: true
    prior-art@ariesclark: true
    why@ariesclark: true
    writing@ariesclark: true
    kagi@kagi-cli: true
  extraKnownMarketplaces:
    ariesclark:
      source:
        source: directory
        path: skills
      autoUpdate: true
    kagi-cli:
      source:
        source: directory
        path: kagi-cli
