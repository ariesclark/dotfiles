apps:
  scoop:main/7zip:
    registry:
      - install-context.reg

  scoop:main/git:
    registry:
      - install-context.reg
      - install-associations.reg

  scoop:main/pwsh:
    registry:
      - install-explorer-context.reg
      - install-file-context.reg
    shims:
      - name: pwsh
        directory: '%LOCALAPPDATA%\Microsoft\WindowsApps'

  scoop:extras/powertoys:
    removeAppx:
      - Microsoft.PowerToys.*ContextMenu
    scripts:
      - path: install-context.ps1
        skipWhenRegistered:
          - WinUI3Apps\ImageResizerContextMenuPackage.msix
          - WinUI3Apps\PowerRenameContextMenuPackage.msix
    startup:
      - name: PowerToys
        path: PowerToys.exe

  scoop:extras/vscode:
    registry:
      - install-context.reg
      - install-associations.reg
      - install-github-integration.reg
    shortcuts:
      - name: Visual Studio Code
        path: Code.exe
        appId: Microsoft.VisualStudioCode.Portable

  scoop:extras/firefox:
    shortcuts:
      - name: Firefox
        path: firefox.exe
        appId: CC05E8481F991693

  scoop:extras/chromium:
    shortcuts:
      - name: Chromium
        path: chrome.exe
        arguments: --user-data-dir="E:\Scoop\apps\chromium\current\User Data" --disable-features=SessionRestoreInfobar,EnableNtpBrowserPromos --no-default-browser-check
        appId: Chromium.H4FX3KY3YMMTY7OOGOGY2E.UserData.Default

  scoop:versions/firefox-nightly:
    shortcuts:
      - name: Firefox Nightly
        path: firefox.exe
        appId: 7DB6B795FC84A795

  scoop:extras/sharex:
    mounts:
      - from: 'E:\Scoop\persist\sharex\ShareX'
        to: 'D:\Users\Documents\ShareX'
    startup:
      - name: ShareX
        path: ShareX.exe
        arguments: -silent

  scoop:extras/protonmail-bridge:
    startup:
      - name: ProtonMailBridge
        path: proton-bridge.exe
        arguments: --no-window

  scoop:games/steam:
    mounts:
      - from: 'E:\Scoop\persist\steam\steamapps'
        to: 'E:\Games\Steam'
      - from: '%LOCALAPPDATA%\Steam'
        to: 'E:\Cache\Steam'
    protocols:
      - name: steam
        path: steam.exe
        arguments: -- "%1"
    startup:
      - name: Steam
        path: steam.exe
        arguments: -silent
      - name: WallpaperEngine
        path: 'E:\Games\Steam\common\wallpaper_engine\wallpaper64.exe'
        arguments: -silent

  winget:AgileBits.1Password:
    installerType: msix

  winget:Anthropic.Claude:
    installerType: msix

  winget:Discord.Discord:
    fixedLocation: true

  winget:RiotGames.Valorant.NA:
    location: 'E:\Games\Riot\VALORANT'

  winget:RiotGames.LeagueOfLegends.NA:
    location: 'E:\Games\Riot\League of Legends'

  steam:578080:
    mounts:
      - from: '%LOCALAPPDATA%\TslGame'
        to: 'E:\Games\PUBG'
