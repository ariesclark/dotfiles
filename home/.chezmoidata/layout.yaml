layout:
  system:
    label: Windows
    letter: C
    sizeGB: 100
  volumes:
    - label: Data
      letter: D
      sizeGB: 400
    - label: Apps & Cache
      letter: E
      sizeGB: null
  scoop: 'E:\Scoop'
  winget: 'E:\Apps' # each winget app installs to its own folder here, named by its id
  state: 'D:\Machine\packages.json'
  environment: # user variables; new processes see them
    TEMP: 'E:\Temp'
    TMP: 'E:\Temp'
    DO_NOT_TRACK: '1' # https://donottrack.sh
  placements:
    - name: ShareX
      link: 'E:\Scoop\persist\sharex\ShareX'
      target: 'D:\Users\Documents\ShareX'
    - name: Steam library
      link: 'E:\Scoop\persist\steam\steamapps'
      target: 'E:\Games\Steam'
    - name: Steam web cache
      link: '%LOCALAPPDATA%\Steam'
      target: 'E:\Cache\Steam'
    - name: PUBG settings, logs and replays
      link: '%LOCALAPPDATA%\TslGame'
      target: 'E:\Games\PUBG'
