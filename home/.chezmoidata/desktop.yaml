desktop:
  taskbar:
    alignment: center # left | center
    search: hidden # hidden | icon | box | button
    taskView: false
    widgets: false
    copilot: false
    pins: # app ids (Store apps' contain a !) or Start menu shortcuts, in taskbar order
      - Microsoft.Windows.Explorer
      - Claude_pzs8sxrjxfjjc!Claude
      - '%ALLUSERSPROFILE%\Microsoft\Windows\Start Menu\Programs\System Tools\Task Manager.lnk'
      - '%APPDATA%\Microsoft\Windows\Start Menu\Programs\Scoop Apps\Firefox.lnk'
      - com.squirrel.Discord.Discord
      - '%APPDATA%\Microsoft\Windows\Start Menu\Programs\Scoop Apps\Visual Studio Code.lnk'

  startup:
    disabled: # startup entries and logon tasks to keep off, even when their app re-adds them
      - MicrosoftEdgeAutoLaunch_* # Edge preloading at sign-in
      - RiotClient # Riot's launcher in the background; Vanguard still starts
      - StartAUEP # AMD's user experience program
      - '\StartDVR' # AMD Instant Replay
