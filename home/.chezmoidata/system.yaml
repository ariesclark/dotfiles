system:
  volumes:
    c:
      label: System
      size: 100GB
    d:
      label: Data
      size: 500GB
    e:
      label: Apps
      size: fill
      pagefile: auto

  wsl:
    distribution: Ubuntu
    user: aries
    drive: w
    mounts:
      - from: 'C:\Windows\System32\OpenSSH'
        to: /mnt/windows/openssh
      - from: '%LOCALAPPDATA%\Microsoft\WindowsApps\Agilebits.1Password_amwd9z03whsfe'
        to: /mnt/windows/1password
      - from: 'E:\Scoop\apps\1password-cli\current'
        to: /mnt/windows/1password-cli
      - from: 'E:\Scoop\apps\vscode\current'
        to: /mnt/windows/vscode
      - from: 'E:\Scoop\apps\firefox\current'
        to: /mnt/windows/firefox
      - from: 'E:\Scoop\persist\vscode\data\extensions'
        to: /mnt/windows/vscode-extensions
      - from: 'E:\Scoop\apps\adb\current\platform-tools'
        to: /mnt/windows/adb
    packages:
      - git
      - jq
      - unzip
      - rustup
      - build-essential
      - pkg-config
      - libssl-dev
      - dotnet-sdk-10.0
      - default-jre-headless
      - python3-venv
      - wl-clipboard
      - xdg-utils
      # Erlang builds through asdf-erlang, without wx, ODBC, Java or docs:
      # https://github.com/asdf-vm/asdf-erlang/blob/master/README.md
      - autoconf
      - m4
      - libncurses-dev
      - cmake
      - docker.io
      - docker-compose-v2
      - docker-buildx
      - uidmap
      - dbus-user-session
      - rootlesskit
      - slirp4netns
      - acl

  install:
    scoop: 'E:\Scoop'
    winget: 'E:\Apps'
    configurationModules: 'E:\Cache\WinGet\Modules'
    record: 'D:\Machine\packages.json'
